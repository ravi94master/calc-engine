<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>calc-engine — plain HTML example</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    Everything below is plain HTML with id / data-value / data-action /
    data-function attributes. There is NOT ONE LINE of calculator logic
    on this page — script.js contains exactly three lines, all of which
    just call into the library.
  -->
  <div class="calculator">
    <div id="display" class="display">0</div>

    <div class="pad scientific">
      <button data-function="sin">sin</button>
      <button data-function="cos">cos</button>
      <button data-function="tan">tan</button>
      <button data-function="log">log</button>
      <button data-function="ln">ln</button>
      <button data-function="sqrt">√</button>
      <button data-function="square">x²</button>
      <button data-function="power">xʸ</button>
      <button data-function="factorial">n!</button>
      <button data-function="pi">π</button>
      <button data-function="e">e</button>
      <button id="angle-mode-toggle">DEG</button>
    </div>

    <div class="pad basic">
      <button data-action="clear" class="op">C</button>
      <button data-action="clear-entry" class="op">CE</button>
      <button data-value="(" class="op">(</button>
      <button data-value=")" class="op">)</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="/" class="op">÷</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="*" class="op">×</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="-" class="op">−</button>

      <button data-action="toggle-sign">±</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button data-value="+" class="op">+</button>

      <button id="backspace">⌫</button>
      <button data-value="%">%</button>
      <button id="copy">Copy</button>
      <button id="equals" class="equals">=</button>
    </div>
  </div>

  <!--
    Native browser ES modules — no build step needed to try this example.
    In production, swap this for the CDN/UMD bundle or an npm import
    (see docs/developer.md for both).
  -->
  <script type="module" src="script.js"></script>
</body>
</html>
